image: rust:slim

before_script:
  - apt-get update && apt-get install -y curl unzip
  - curl -L -sLo zola.tar.gz https://github.com/getzola/zola/releases/download/v0.20.0/zola-v0.20.0-x86_64-unknown-linux-gnu.tar.gz
  - tar -xzf zola.tar.gz
  - mv zola /usr/local/bin/

pages:
  script:
    - zola build
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'